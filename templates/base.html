<!doctype html>
<html lang="ru">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Sakila Movie Search
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block styles %}
    {% endblock %}

</head>

<body class="bg-light d-flex flex-column min-vh-100">


<!-- Общая верхняя панель -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('index') }}"
        >
            🎬 Sakila Movie Search
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-navigation"
            aria-controls="main-navigation"
            aria-expanded="false"
            aria-label="Открыть навигацию"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="main-navigation"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('index') }}"
                    >
                        Поиск
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('top_queries') }}"
                    >
                        Популярные
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('recent_queries') }}"
                    >
                        Последние
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- Уникальный заголовок страницы -->
{% block header %}
{% endblock %}


<!-- Уникальное содержимое страницы -->
<main class="container py-5 flex-grow-1">

    {% block content %}
    {% endblock %}

</main>


<!-- Общий подвал -->
<footer class="bg-dark text-white py-4 mt-auto">

    <div class="container text-center">

        <p class="mb-1">
            Sakila Movie Search
        </p>

        <small class="text-white-50">
            Учебный проект на Python, Flask, MySQL и MongoDB
        </small>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>

{% block scripts %}
{% endblock %}

</body>

</html>
